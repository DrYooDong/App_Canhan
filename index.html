<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nội Tâm — Trung tâm Tri thức & Phản tư Cá nhân. Hệ thống quản lý tri thức cá nhân kết hợp Tử Vi.">
  <meta name="theme-color" content="#070912">
  <title>Nội Tâm — Tri thức Cá nhân</title>

  <script>
    (function() {
      try {
        const saved = localStorage.getItem('noitam_theme');
        const theme = saved ? JSON.parse(saved) : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="index.css">

  <!-- Favicon (inline SVG data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☯</text></svg>">
</head>
<body>
  <!-- Mobile Header Bar -->
  <header class="mobile-top-bar" id="mobile-top-bar">
    <div class="mobile-brand" onclick="App.Router.navigate('dashboard')">
      <div class="mobile-logo">☯</div>
      <span class="mobile-title">NỘI TÂM</span>
    </div>
    <div class="mobile-top-actions">
      <div class="mobile-lunar-badge" id="mobile-lunar-badge" title="Lịch Âm Dương">📅 Đang tải...</div>
      <button class="mobile-icon-btn" id="mobile-theme-toggle-btn" title="Đổi giao diện" aria-label="Đổi giao diện">☀️</button>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">☰</button>
    </div>
  </header>

  <!-- Sidebar Overlay for Mobile -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <div class="content-container">
        <!-- Content will be rendered by router -->
        <div class="empty-state animate-fade-in">
          <div class="empty-state-icon">☯</div>
          <div class="empty-state-title">Đang tải...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- SOS Floating Button -->
  <button class="sos-btn" id="sos-btn" title="Lời nhắc ngay lập tức" aria-label="SOS">💡</button>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
    <div class="mobile-nav-item active" data-route="dashboard" onclick="App.Router.navigate('dashboard')">
      <span class="mobile-nav-icon">📅</span>
      <span class="mobile-nav-label">Lịch</span>
    </div>
    <div class="mobile-nav-item" data-route="astrology" onclick="App.Router.navigate('astrology')">
      <span class="mobile-nav-icon">🔮</span>
      <span class="mobile-nav-label">Tử Vi</span>
    </div>
    <div class="mobile-nav-item" data-route="finance" onclick="App.Router.navigate('finance')">
      <span class="mobile-nav-icon">💰</span>
      <span class="mobile-nav-label">Tài Chính</span>
    </div>
    <div class="mobile-nav-item" data-route="oracle" onclick="App.Router.navigate('oracle')">
      <span class="mobile-nav-icon">🧭</span>
      <span class="mobile-nav-label">Kỳ Môn</span>
    </div>
    <div class="mobile-nav-item" data-route="knowledge" onclick="App.Router.navigate('knowledge')">
      <span class="mobile-nav-icon">📜</span>
      <span class="mobile-nav-label">Tri Thức</span>
    </div>
  </nav>

  <!-- Data -->
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data/tuvi.js"></script>
  <script src="data/supabase_client.js"></script>
  <script src="data/sample.js"></script>
  <script src="data/astrology_logic.js"></script>
  <script src="data/ziwei_patterns.js"></script>
  <script src="data/ziwei_star_knowledge.js"></script>
  <script src="data/ziwei_marriage_knowledge.js"></script>
  <script src="data/ziwei_famous.js"></script>
  <script src="data/ziwei_classics.js"></script>

  <!-- Thư viện Lịch Âm -->
  <script src="https://unpkg.com/lunar-javascript/lunar.js"></script>

  <!-- Sub-components & Specialized Modules -->
  <script src="components/sidebar.js"></script>
  <script src="components/overview.js"></script>
  <script src="components/lessons.js"></script>
  <script src="components/rules.js"></script>
  <script src="components/reminders.js"></script>
  <script src="components/library.js"></script>
  <script src="components/journal.js"></script>
  <script src="components/search.js"></script>
  <script src="components/health.js"></script>
  <script src="components/compass.js"></script>
  <script src="components/heatmap.js"></script>
  <script src="components/iching.js"></script>
  <script src="components/morning.js"></script>
  <script src="components/tasks.js"></script>
  <script src="components/timemachine.js"></script>
  <script src="components/numerology.js"></script>

  <!-- Core Consolidated Module Hubs -->
  <script src="components/dashboard.js"></script>
  <script src="components/astrology.js"></script>
  <script src="components/oracle.js"></script>
  <script src="components/knowledge.js"></script>

  <!-- Breakthrough Feature Components -->
  <script src="components/commandcenter.js"></script>
  <script src="components/finance.js"></script>
  <script src="components/meditation.js"></script>
  <script src="components/retroverify.js"></script>
  <script src="components/moodtracker.js"></script>
  <script src="components/rpg.js"></script>

  <!-- App Core (must be last) -->
  <script src="app.js"></script>
</body>
</html>
